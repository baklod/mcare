name: mcare-docker-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: "no"
    working_dir: /var/www/html
    env_file:
      - .env.docker
    environment:
      APP_URL: "http://127.0.0.1:${DOCKER_APP_PORT:-8000}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: "${DOCKER_DB_DATABASE:?Set DOCKER_DB_DATABASE in .env.docker}"
      DB_USERNAME: "${DOCKER_DB_USERNAME:?Set DOCKER_DB_USERNAME in .env.docker}"
      DB_PASSWORD: "${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env.docker}"
    command:
      - sh
      - -lc
      - >-
        mkdir -p
        storage/app/private
        storage/app/public
        storage/framework/cache/data
        storage/framework/sessions
        storage/framework/views
        storage/logs
        bootstrap/cache
        &&
        exec php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "127.0.0.1:${DOCKER_APP_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: .
        target: /var/www/html
      - type: bind
        source: ./.env.docker
        target: /var/www/html/.env
        read_only: true
      - mcare_vendor:/var/www/html/vendor
      - mcare_storage:/var/www/html/storage
      - mcare_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8000/up
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 1.0
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

  database:
    image: mariadb:10.11.18
    restart: "no"
    environment:
      MARIADB_DATABASE: "${DOCKER_DB_DATABASE:?Set DOCKER_DB_DATABASE in .env.docker}"
      MARIADB_USER: "${DOCKER_DB_USERNAME:?Set DOCKER_DB_USERNAME in .env.docker}"
      MARIADB_PASSWORD: "${DOCKER_DB_PASSWORD:?Set DOCKER_DB_PASSWORD in .env.docker}"
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      TZ: Asia/Manila
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=192M
      - --innodb-log-buffer-size=8M
      - --max-connections=40
      - --table-open-cache=200
      - --thread-cache-size=4
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --performance-schema=OFF
      - --skip-log-bin
    ports:
      - "127.0.0.1:${DOCKER_DB_HOST_PORT:-3307}:3306"
    volumes:
      - mcare_database:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    pids_limit: 256
    cpus: 0.75
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

  vite:
    image: node:24.18.0-bookworm-slim
    profiles:
      - frontend
    init: true
    restart: "no"
    working_dir: /var/www/html
    environment:
      APP_NAME: MCARE
      VITE_APP_NAME: MCARE
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5173"
      - --strictPort
    ports:
      - "127.0.0.1:${DOCKER_VITE_PORT:-5173}:5173"
    volumes:
      - type: bind
        source: .
        target: /var/www/html
      - type: bind
        source: ./.env.docker
        target: /var/www/html/.env
        read_only: true
      - mcare_node_modules:/var/www/html/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 192
    cpus: 1.0
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

volumes:
  mcare_database:
  mcare_vendor:
  mcare_node_modules:
  mcare_storage:
  mcare_bootstrap_cache:
